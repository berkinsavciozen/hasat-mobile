name: EAS TestFlight Build + Submit (iOS)

# Yalnızca elle tetiklenir — otomatik tetikleyici (push/PR/schedule) YOK.
# `eas-build-simulator.yml`'in kardeşi: aynı kota-koruma mantığı, farklı
# profil. Bu workflow iOS Simulator DEĞİL, gerçek cihaza TestFlight
# üzerinden kurulacak bir prodüksiyon-imzalı build üretir
# (`eas.json` → `ios-testflight` profili, `distribution: "store"`).
#
# Kota koruması (bkz. hasat-vault TODO.md → "P23-M8-a"):
# Expo'nun ücretsiz katmanı ayda 30 build'e izin veriyor (iOS için bunların
# en fazla 15'i, bu iki workflow AYNI 15'lik havuzu paylaşıyor), kuyrukta
# bekleme süresi 90 dakikayı aşabiliyor, ve her BAŞARISIZ deneme de
# kotadan düşüyor. Bu yüzden bu workflow da yalnızca elle, `app.json` ve
# Apple kimlik bilgileri (bundle ID kaydı + Push Notifications capability +
# APNs anahtarı EAS'a yüklü) hazırken çalıştırılmalıdır. (Submit adımı bu
# kotaya dahil değil — yalnızca build'ler sayılıyor.)
#
# P23-M8-c: build + submit artık AYNI iş akışında. App Store Connect API
# Key EAS'a kayıtlı (Team Keys, Admin erişim, Key ID `TGL8Z9MNTT`) —
# `eas submit --non-interactive` bu sayede Apple kimlik doğrulaması
# istemeden çalışıyor (Berkin'in terminalinde doğrulandı). `eas.json` →
# `submit.ios-testflight.ios.ascAppId` (`6798678884`, App Store Connect'teki
# Hasat-AI'ın Apple ID'si) dolduruldu — non-interactive submit'in uygulamayı
# bundle ID'den aramaya çalışıp Apple'a etkileşimli sorup takılmaması için
# gerekli. Önceki sürümde submit ayrı, tek seferlik bir terminal adımıydı;
# artık aynı "Run workflow" tetiklemesiyle build biter bitmez submit ediliyor.

on:
  workflow_dispatch:

jobs:
  build-and-submit-testflight:
    name: iOS TestFlight Build + Submit
    runs-on: ubuntu-latest
    steps:
      - name: Repo checkout
        uses: actions/checkout@v4

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Expo + EAS CLI kurulumu
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Bağımlılıkları kur (npm ci)
        run: npm ci

      - name: EAS TestFlight build (iOS, non-interactive)
        run: |
          eas build --profile ios-testflight --platform ios --non-interactive --json > eas-build-output.json
          cat eas-build-output.json

      - name: EAS TestFlight submit (iOS, non-interactive)
        run: |
          eas submit --profile ios-testflight --platform ios --non-interactive --latest

      - name: Artifact linkini özet sayfasına yaz
        if: always()
        run: |
          ARTIFACT_URL=""
          if [ -f eas-build-output.json ]; then
            ARTIFACT_URL=$(node -e "
              try {
                const raw = require('fs').readFileSync('eas-build-output.json', 'utf8');
                const data = JSON.parse(raw);
                const build = Array.isArray(data) ? data[0] : data;
                const url = build?.artifacts?.buildUrl
                  || build?.artifacts?.applicationArchiveUrl
                  || build?.buildDetailsPageUrl
                  || build?.url
                  || '';
                console.log(url);
              } catch (e) {
                console.log('');
              }
            ")
          fi

          {
            echo '## 📱 EAS TestFlight Build + Submit (iOS)'
            echo ''
            if [ -n "$ARTIFACT_URL" ]; then
              echo "**Build detay linki:** $ARTIFACT_URL"
            else
              echo '⚠️ Artifact linki `--json` çıktısından otomatik çıkarılamadı.'
              echo ''
              echo 'Expo panosunda Projects → hasat-mobile (proje ID: `bff1a47c-41d5-42fa-bddc-83320c079253`) → Builds sekmesinden en son build'"'"'i bul.'
            fi
            echo ''
            echo '**Submit:** Build biter bitmez aynı işte `eas submit --profile ios-testflight --non-interactive --latest` çalıştı — App Store Connect API Key (Team Keys, Key ID `TGL8Z9MNTT`) sayesinde etkileşimli Apple kimlik doğrulaması gerekmedi. Bu adım başarısız olduysa yukarıdaki "EAS TestFlight submit" step logunu kontrol et.'
            echo ''
            echo 'Submit kabul edilirse Apple tarafında işlenmesi (genelde birkaç dk – yarım saat) sürer, sonra TestFlight sekmesinde görünür; Berkin kendi hesabını internal tester olarak eklemeli (bkz. hasat-vault TODO.md → "P23-M8-a" adım adım liste).'
            echo ''
            echo '---'
            echo '_Kota hatırlatması: ücretsiz katman ayda 30 build (iOS'"'"'de en fazla 15, `eas-build-simulator.yml` ile PAYLAŞILAN havuz) — başarısız denemeler de düşer, submit bu kotaya dahil değil. Bu workflow'"'"'u sadece gerçekten bir TestFlight build'"'"'ine ihtiyacın olduğunda çalıştır._'
          } >> "$GITHUB_STEP_SUMMARY"
