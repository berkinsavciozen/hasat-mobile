name: EAS TestFlight Build + Submit (iOS)

# TestFlight is a release operation, not PR validation. It is manual-only and
# requires both an explicit repository ref and its expected full commit SHA.
on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: "Repository branch, tag, or commit to release"
        required: true
        type: string
      expected_sha:
        description: "Expected full 40-character commit SHA for release_ref"
        required: true
        type: string
      latest_asc_build_number:
        description: "Latest iOS build number already present in App Store Connect"
        required: true
        type: number

permissions:
  contents: read

concurrency:
  group: hasat-mobile-testflight-release
  cancel-in-progress: false
  queue: max

jobs:
  build-and-submit-testflight:
    name: iOS TestFlight Build + Submit
    runs-on: ubuntu-latest
    env:
      EAS_PROFILE: ios-testflight
    steps:
      - name: Seçilen ref'i checkout et
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0

      - name: Release kaynağını doğrula
        id: release_source
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REPOSITORY" != "berkinsavciozen/hasat-mobile" ]; then
            echo "Refusing release: unexpected repository." >&2
            exit 1
          fi
          if ! printf '%s' "$EXPECTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "Refusing release: expected_sha must be a full lowercase commit SHA." >&2
            exit 1
          fi
          RESOLVED_SHA="$(git rev-parse HEAD)"
          if [ "$RESOLVED_SHA" != "$EXPECTED_SHA" ]; then
            echo "Refusing release: selected ref does not resolve to expected_sha." >&2
            exit 1
          fi
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Selected ref: $RELEASE_REF"
          echo "Full commit SHA: $RESOLVED_SHA"
          echo "EAS profile: $EAS_PROFILE"
          echo "resolved_sha=$RESOLVED_SHA" >> "$GITHUB_OUTPUT"

      - name: Node.js kurulumu
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Expo + EAS CLI kurulumu
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Bağımlılıkları kur (npm ci)
        run: npm ci

      - name: EAS uzak build numarası preflight
        id: version_preflight
        env:
          LATEST_ASC_BUILD_NUMBER: ${{ inputs.latest_asc_build_number }}
        run: |
          set -euo pipefail
          eas build:version:get --platform ios --profile "$EAS_PROFILE" --non-interactive --json > eas-version.json
          REMOTE_BUILD_NUMBER="$(node -e "
            const value = JSON.parse(require('fs').readFileSync('eas-version.json', 'utf8')).buildNumber;
            if (!/^[0-9]+$/.test(String(value ?? ''))) process.exit(1);
            process.stdout.write(String(value));
          ")"
          if ! printf '%s' "$LATEST_ASC_BUILD_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "Preflight failed: latest App Store Connect build number must be a non-negative integer." >&2
            exit 1
          fi
          NEXT_BUILD_NUMBER=$((REMOTE_BUILD_NUMBER + 1))
          if [ "$REMOTE_BUILD_NUMBER" -lt "$LATEST_ASC_BUILD_NUMBER" ]; then
            echo "Preflight failed: EAS remote counter is behind App Store Connect." >&2
            echo "Remediation: stop and explicitly synchronize the EAS remote version with the store before releasing." >&2
            exit 1
          fi
          if [ "$NEXT_BUILD_NUMBER" -lt 3 ] || [ "$NEXT_BUILD_NUMBER" -le "$LATEST_ASC_BUILD_NUMBER" ]; then
            echo "Preflight failed: autoIncrement would not produce an unused build number 3 or greater." >&2
            echo "Remediation: stop and explicitly synchronize the EAS remote version with the store before releasing." >&2
            exit 1
          fi
          APP_VERSION="$(node -p "require('./app.json').expo.version")"
          echo "App version: $APP_VERSION"
          echo "EAS remote iOS counter: $REMOTE_BUILD_NUMBER"
          echo "Expected auto-incremented build: $NEXT_BUILD_NUMBER"
          echo "Latest App Store Connect build (operator supplied): $LATEST_ASC_BUILD_NUMBER"
          echo "app_version=$APP_VERSION" >> "$GITHUB_OUTPUT"
          echo "remote_build_number=$REMOTE_BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "next_build_number=$NEXT_BUILD_NUMBER" >> "$GITHUB_OUTPUT"

      - name: EAS TestFlight build + exact auto-submit
        run: |
          set -euo pipefail
          eas build \
            --profile "$EAS_PROFILE" \
            --platform ios \
            --auto-submit-with-profile "$EAS_PROFILE" \
            --wait \
            --non-interactive \
            --json > eas-build-output.json

      - name: Release özetini yaz
        if: always()
        env:
          RELEASE_REF: ${{ inputs.release_ref }}
          RESOLVED_SHA: ${{ steps.release_source.outputs.resolved_sha }}
          APP_VERSION: ${{ steps.version_preflight.outputs.app_version }}
          REMOTE_BUILD_NUMBER: ${{ steps.version_preflight.outputs.remote_build_number }}
          NEXT_BUILD_NUMBER: ${{ steps.version_preflight.outputs.next_build_number }}
        run: |
          {
            echo '## EAS TestFlight Build + Submit (iOS)'
            echo ''
            echo "- Repository: $GITHUB_REPOSITORY"
            echo "- Selected ref: $RELEASE_REF"
            echo "- Full commit SHA: $RESOLVED_SHA"
            echo "- EAS profile: $EAS_PROFILE"
            if [ -n "$APP_VERSION" ]; then echo "- App version: $APP_VERSION"; fi
            if [ -n "$REMOTE_BUILD_NUMBER" ]; then echo "- Preflight remote counter: $REMOTE_BUILD_NUMBER"; fi
            if [ -n "$NEXT_BUILD_NUMBER" ]; then echo "- Expected build number: $NEXT_BUILD_NUMBER"; fi
            echo ''
            echo 'Submission is coupled to this run with EAS build auto-submit; no latest-build lookup is used.'
          } >> "$GITHUB_STEP_SUMMARY"
